<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Mom ❤️</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(to right, #a1c4fd, #c2e9fb);
    padding-top: 100px;
}

input, button {
    padding: 10px;
    font-size: 16px;
    margin: 10px;
}

.hidden {
    display: none;
}

h1 {
    font-size: 35px;
}

p {
    font-size: 20px;
}
</style>
</head>

<body>

<!-- 🔐 PAGE 1: CODE -->
<div id="page1">
    <h1>Enter Code 🔐</h1>
    <input type="password" id="code" placeholder="Enter code">
    <br>
    <button onclick="checkCode()">Open</button>
    <p id="error1" style="color:red;"></p>
</div>

<!-- 💬 PAGE 2: MESSAGE -->
<div id="page2" class="hidden">
    <h1>Hey BP, how are you? 😊</h1>
    <input type="text" id="reply" placeholder="Type your message">
    <br>
    <button onclick="checkMessage()">Submit</button>
</div>

<!-- ❤️ PAGE 3: RESPONSE -->
<div id="page3" class="hidden">
    <h1>Oh good, lovely ❤️</h1>
</div>

<script>
function checkCode() {
    let code = document.getElementById("code").value;

    if (code === "BP") {
        document.getElementById("page1").style.display = "none";
        document.getElementById("page2").style.display = "block";
    } else {
        document.getElementById("error1").innerText = "Wrong code!";
    }
}

function checkMessage() {
    let msg = document.getElementById("reply").value.toLowerCase();

    if (msg === "fine") {
        document.getElementById("page2").style.display = "none";
        document.getElementById("page3").style.display = "block";
    } else {
        alert("Say 'fine' 😄");
    }
}
</script>

</body>
</html>
