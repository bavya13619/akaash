<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>For You ❤️</title>
    <style>
        body {
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
            color: #333;
        }
        h1 {
            font-size: 40px;
        }
        p {
            font-size: 20px;
            max-width: 600px;
            margin: auto;
        }
        .heart {
            font-size: 50px;
            animation: beat 1s infinite;
        }
        @keyframes beat {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="heart">❤️</div>
    <h1>Hey Love 💕</h1>

    <p>
        If (you == mine) { <br>
        &nbsp;&nbsp;&nbsp;&nbsp;happiness++; <br>
        &nbsp;&nbsp;&nbsp;&nbsp;love = infinite; <br>
        } <br><br>

        You are the best part of my life,  
        like a perfect algorithm that never fails 💫  
        <br><br>
        No bugs, no errors — just pure love ❤️  
    </p>

</body>
</html>
